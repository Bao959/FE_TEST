name: Deploy Web Admin to AWS S3 & CloudFront

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: chamdua-admin-web-2026
  CLOUDFRONT_DISTRIBUTION_ID: EDCOKOQABTLXK
  # Link ALB Backend đã hoạt động
  VITE_API_BASE_URL: http://chamdua-alb-1535650319.ap-southeast-1.elb.amazonaws.com

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite TypeScript Project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Build Files to S3 Bucket
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
